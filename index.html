<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TMDB 영화 검색 서비스</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🎬 영화 검색 & 찜하기</h1>
    <form id="searchForm" class="search-box">
      <input type="text" id="searchInput" placeholder="영화 제목을 입력하세요..." required>
      <button type="submit">검색</button>
    </form>
  </header>

  <main>
    <section>
      <h2>🔥 인기 영화</h2>
      <div id="movieContainer" class="movie-grid"></div>
    </section>

    <section>
      <h2>❤️ 내가 찜한 영화</h2>
      <div id="favoritesContainer" class="movie-grid"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
